<!DOCTYPE html>
<html>
<head>
    <title>Age Calculator</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        <!--color of the webpage-->
        header{
            background-color:#4A5ACD;
            padding:20px;
            text-align:center;
            color:rgb(102, 30, 30);
        }

        .app{
            padding:20px;
            color:#5a3d88;
        }
    </style>
</head>

<body>
<!--Used AI to help with syntaxes and organized-->
<!--trigger boxes-->
<div x-data="webApp()">

    <header>
        <h2>Age Calculator</h2>
    </header>

    <div class="app">

        <label>Birth Month:</label><br>
        <input type="number" x-model.number="birthMonth"><br>

        <label>Birth Day:</label><br>
        <input type="number" x-model.number="birthDay"><br>

        <label>Birth Year:</label><br>
        <input type="number" x-model.number="birthYear"><br><br>

        <label>Current Month:</label><br>
        <input type="number" x-model.number="currentMonth"><br>

        <label>Current Day:</label><br>
        <input type="number" x-model.number="currentDay"><br>

        <label>Current Year:</label><br>
        <input type="number" x-model.number="currentYear"><br><br>

        <button @click="calculateAge()">Calculate Age</button>

        <p>
            Your age is:
            <span x-text="ageYears"></span> Years,
            <span x-text="ageMonths"></span> Months,
            <span x-text="ageDays"></span> Days
        </p>

        <ul>
            <template x-for="item in history">
                <li x-text="item"></li>
            </template>
        </ul>

    </div>

</div>

<script>
  //history and the age calulation part
  //used AI to help with the negative year issue
document.addEventListener('alpine:init', () => {
    Alpine.data('webApp', () => ({
        birthMonth: null,
        birthDay: null,
        birthYear: null,

        currentMonth: null,
        currentDay: null,
        currentYear: null,

        ageYears: 0,
        ageMonths: 0,
        ageDays: 0,

        history: [],

        calculateAge() {

            if (this.birthYear && this.currentYear) {

                let years = Math.max(0, this.currentYear - this.birthYear);
                let months = this.currentMonth - this.birthMonth;
                let days = this.currentDay - this.birthDay;

                if (days < 0) {
                    days += 30;
                    months--;
                }

                if (months < 0) {
                    months += 12;
                    years--;
                }

                years = Math.max(0, years);

                this.ageYears = years;
                this.ageMonths = months;
                this.ageDays = days;

                this.history.push(
                    years + " Years, " +
                    months + " Months, " +
                    days + " Days"
                );
            }
        }
    }));
});
</script>

<footer>
   <p>© 2026-2027<br>
     AP Computer Science Principles<br>
     George Washington High School</p>
</footer>

</body>
</html>
